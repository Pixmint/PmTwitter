services:
  pmt-bot:
    build: .
    container_name: pmtwitter
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - data:/app/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - pmt-network

volumes:
  data:
    driver: local

networks:
  pmt-network:
    driver: bridge
